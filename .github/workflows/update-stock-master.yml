name: update stock master
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-stock-master.mjs'
      - '.github/workflows/update-stock-master.yml'
  schedule:
    - cron: '20 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-stock-master.mjs
      - name: Commit stock master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock-master.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh stock master'
          git push