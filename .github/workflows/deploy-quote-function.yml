name: Deploy quote function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/quote/**'
      - '.github/workflows/deploy-quote-function.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy quote Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy quote --project-ref ahixjacfjljhqvatzqfn
