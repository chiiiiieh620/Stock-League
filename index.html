<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1017">
  <title>Stock League｜股票排位賽</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="menuBtn" class="menu-btn" aria-label="開啟選單">☰</button>
  <div id="backdrop" class="backdrop"></div>

  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <span class="brand-mark">SL</span>
      <div><strong>Stock League</strong><small>投資排位賽</small></div>
    </div>
    <nav>
      <a href="#overview" class="nav-link active">總覽</a>
      <a href="#leaderboard" class="nav-link">排行榜</a>
      <a href="#join" class="nav-link">參賽者</a>
      <a href="#position" class="nav-link">新增持倉</a>
      <a href="#portfolios" class="nav-link">投資組合</a>
    </nav>
    <div class="side-footer">
      <span id="syncDot" class="sync-dot"></span><span id="syncText">連線中</span>
    </div>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <div>
        <span class="eyebrow">STOCK LEAGUE</span>
        <h1>股票排位賽</h1>
        <p>最多 15 人，用真實持倉比總報酬率。</p>
      </div>
      <button id="refreshBtn" class="secondary">重新整理</button>
    </header>

    <main>
      <section id="overview" class="stats-grid">
        <article class="stat-card"><small>參賽者</small><strong id="statPlayers">0</strong><span>最多 15 人</span></article>
        <article class="stat-card"><small>總持倉筆數</small><strong id="statHoldings">0</strong><span>全聯盟</span></article>
        <article class="stat-card"><small>領先者</small><strong id="statLeader">—</strong><span id="statLeaderReturn">尚無資料</span></article>
        <article class="stat-card"><small>全聯盟市值</small><strong id="statValue">0</strong><span>依最新價格計算</span></article>
      </section>

      <section id="leaderboard" class="panel">
        <div class="section-head">
          <div><span class="eyebrow">LEADERBOARD</span><h2>排行榜</h2></div>
          <span id="playerCount" class="pill">0 / 15</span>
        </div>
        <div id="status" class="status">讀取中…</div>
        <div id="leaderboardList" class="leaderboard"></div>
      </section>

      <section class="grid">
        <form id="playerForm" class="panel form-card" data-section="join" id="joinForm">
          <div id="join"></div>
          <span class="eyebrow">JOIN</span><h2>新增參賽者</h2>
          <label>名稱<input id="playerName" maxlength="30" required placeholder="例如：小霈"></label>
          <button type="submit">加入排位賽</button>
        </form>

        <form id="holdingForm" class="panel form-card">
          <div id="position"></div>
          <span class="eyebrow">POSITION</span><h2>新增持倉</h2>
          <label>參賽者<select id="holdingPlayer" required></select></label>
          <div class="two">
            <label>股票代號<input id="symbol" required maxlength="20" placeholder="2330 / NVDA" autocomplete="off"></label>
            <label>市場<select id="market"><option value="TWSE">台股上市</option><option value="TPEX">台股上櫃</option><option value="US">美股</option><option value="OTHER">其他</option></select></label>
          </div>
          <div class="three">
            <label>股數<input id="shares" type="number" min="0.000001" step="any" required></label>
            <label>平均成本<input id="avgCost" type="number" min="0" step="any" required></label>
            <label>目前價格
              <div class="price-field"><input id="currentPrice" type="number" min="0" step="any" required placeholder="自動帶入"><button id="fetchPriceBtn" type="button" class="mini-btn">抓價</button></div>
              <small id="priceHint" class="field-hint">輸入股票代號後會自動抓取現價</small>
            </label>
          </div>
          <button type="submit">新增持倉</button>
        </form>
      </section>

      <section id="portfolios" class="panel">
        <div class="section-head"><div><span class="eyebrow">PORTFOLIOS</span><h2>所有持倉</h2></div></div>
        <div id="portfoliosList"></div>
      </section>
    </main>

    <footer>Stock League · 僅供比賽紀錄，不構成投資建議</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
